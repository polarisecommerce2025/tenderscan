services:
  tenderscan:
    image: python:3.12-slim
    container_name: tenderscan
    restart: unless-stopped
    network_mode: host   # na VPS mapowanie portów zgłaszało "address already in use"
    environment:
      TZ: Europe/Warsaw
      TS_DATA_DIR: /data
      TS_PORT: "18765"
      TS_USER: ${TS_USER:-admin}
      TS_PASS: ${TS_PASS:?ustaw TS_PASS}
      TS_INTERVAL_H: "6"
      TS_BACKFILL_DAYS: "30"
      TS_MIN_RELEVANCE: "50"
      TS_REPO_TGZ: https://codeload.github.com/polarisecommerce2025/tenderscan/tar.gz/refs/heads/main
    volumes:
      - tenderscan_data:/data
    # Przy każdym starcie pobiera aktualny kod z GitHuba (aktualizacja = push + restart kontenera)
    command:
      - sh
      - -c
      - >-
        rm -rf /src && python -c "import os,io,tarfile,urllib.request;
        tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(os.environ['TS_REPO_TGZ']).read())).extractall('/src')"
        && cd /src/tenderscan-main && exec python -u -m tenderscan.server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18765/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  tenderscan_data:
